<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper - Khomlakova Kristina</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Minesweeper</h1>
        
        <!-- Game Header -->
        <div class="game-header">
            <div class="counter">
                <span class="label">Mines:</span>
                <span class="digital" id="mines-count">10</span>
            </div>
            
            <button class="new-game-btn" id="new-game">🌸 New Game</button>
            
            <div class="counter">
                <span class="label">Time:</span>
                <span class="digital" id="timer">000</span>
            </div>
        </div>

        <!-- Game Board -->
        <div class="game-board">
            <!-- Row 1 -->
            <div class="row">
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell number1">1</div>
                <div class="cell flag"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell mine"></div>
                <div class="cell number2">2</div>
            </div>
            
            <!-- Row 2 -->
            <div class="row">
                <div class="cell closed"></div>
                <div class="cell number1">1</div>
                <div class="cell number1">1</div>
                <div class="cell number1">1</div>
                <div class="cell number2">2</div>
                <div class="cell mine"></div>
                <div class="cell number3">3</div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
            </div>
            
            <!-- Row 3 -->
            <div class="row">
                <div class="cell closed"></div>
                <div class="cell number1">1</div>
                <div class="cell mine exploded"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell mine"></div>
                <div class="cell number4">4</div>
                <div class="cell closed"></div>
            </div>
            
            <!-- Row 4 -->
            <div class="row">
                <div class="cell closed"></div>
                <div class="cell number1">1</div>
                <div class="cell number2">2</div>
                <div class="cell number3">3</div>
                <div class="cell number3">3</div>
                <div class="cell number3">3</div>
                <div class="cell number2">2</div>
                <div class="cell number1">1</div>
                <div class="cell closed"></div>
            </div>
            
            <!-- Row 5 -->
            <div class="row">
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell mine"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
            </div>
            
            <!-- Row 6 -->
            <div class="row">
                <div class="cell number1">1</div>
                <div class="cell number2">2</div>
                <div class="cell number2">2</div>
                <div class="cell number1">1</div>
                <div class="cell closed"></div>
                <div class="cell flag"></div>
                <div class="cell number1">1</div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
            </div>
            
            <!-- Row 7 -->
            <div class="row">
                <div class="cell mine"></div>
                <div class="cell mine"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell number2">2</div>
                <div class="cell number3">3</div>
                <div class="cell mine"></div>
                <div class="cell number2">2</div>
                <div class="cell closed"></div>
            </div>
            
            <!-- Row 8 -->
            <div class="row">
                <div class="cell number2">2</div>
                <div class="cell number3">3</div>
                <div class="cell closed"></div>
                <div class="cell flag"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell number1">1</div>
                <div class="cell closed"></div>
            </div>
            
            <!-- Row 9 -->
            <div class="row">
                <div class="cell mine"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
                <div class="cell closed"></div>
            </div>
        </div>
    </div>
</body>
</html>
